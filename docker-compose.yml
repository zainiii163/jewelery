version: "3.8"

services:
  # Production-like stack
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - web
      - admin
    networks:
      - appnet

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://${DOMAIN:-localhost}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/database/database.sqlite
      SANCTUM_STATEFUL_DOMAINS: ${DOMAIN:-localhost}
      SESSION_DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./server/database:/var/www/database
      - ./server/storage:/var/www/storage
    networks:
      - appnet

  web:
    build:
      context: ./website
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:-localhost}
        NEXT_PUBLIC_SHOP_CODE: ${SHOP_CODE:-MAIN}
        NEXT_PUBLIC_SITE_NAME: ${SITE_NAME:-Tayyab Jewellers}
    environment:
      NODE_ENV: production
    networks:
      - appnet

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://${DOMAIN:-localhost}
        VITE_BASE: /admin/
    networks:
      - appnet

  # Dev stack (run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up)
  api-dev:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/database/database.sqlite
    volumes:
      - ./server:/var/www
      - ./server/database:/var/www/database
      - ./server/storage:/var/www/storage
    ports:
      - "9000:9000"
    networks:
      - appnet

  web-dev:
    build:
      context: ./website
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SHOP_CODE: MAIN
      NEXT_PUBLIC_SITE_NAME: Tayyab Jewellers
    volumes:
      - ./website:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    command: npm run dev
    networks:
      - appnet

  # Queue worker (optional, for async jobs)
  queue:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./server:/var/www
      - ./server/database:/var/www/database
    networks:
      - appnet
    depends_on:
      - api

  # Scheduler (optional)
  scheduler:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: php artisan schedule:work
    volumes:
      - ./server:/var/www
      - ./server/database:/var/www/database
    networks:
      - appnet

networks:
  appnet:
    driver: bridge